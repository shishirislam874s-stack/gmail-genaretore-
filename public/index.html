<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gmail Dot Alias Generator — Liquid Glass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(28px, -22px) scale(1.08); }
    }
    @keyframes floatAlt {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-26px, 24px) scale(1.06); }
    }
    .orb-1 { animation: floatSlow 11s ease-in-out infinite; }
    .orb-2 { animation: floatAlt 14s ease-in-out infinite; }
    .liquid-glass {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.03));
      backdrop-filter: blur(24px) saturate(165%);
      -webkit-backdrop-filter: blur(24px) saturate(165%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.55),
        inset 0 1px 1px rgba(255, 255, 255, 0.28),
        inset 0 -1px 1px rgba(255, 255, 255, 0.06);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      outline: none;
      border-color: rgba(56, 189, 248, 0.75);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18), inset 0 1px 2px rgba(0, 0, 0, 0.35);
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
      transition: all 0.18s ease;
    }
    .glass-pill:hover {
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.45);
      transform: translateY(-1px);
    }
    .liquid-btn {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.9), rgba(129, 140, 248, 0.88));
      box-shadow:
        0 10px 28px rgba(56, 189, 248, 0.32),
        inset 0 1px 1px rgba(255, 255, 255, 0.55);
      transition: all 0.2s ease;
    }
    .liquid-btn:hover {
      transform: translateY(-1px) scale(1.01);
      box-shadow:
        0 14px 34px rgba(56, 189, 248, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.7);
    }
    .liquid-btn:active { transform: scale(0.99); }
  </style>
</head>
<body class="bg-[#050811] text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden selection:bg-sky-400/30">
  <!-- Liquid Ambient Orbs -->
  <div class="pointer-events-none fixed inset-0 overflow-hidden -z-10">
    <div class="orb-1 absolute -top-24 -left-24 w-96 h-96 rounded-full bg-cyan-500/25 blur-3xl"></div>
    <div class="orb-2 absolute top-1/3 -right-24 w-[28rem] h-[28rem] rounded-full bg-indigo-500/25 blur-3xl"></div>
    <div class="orb-1 absolute -bottom-28 left-1/4 w-96 h-96 rounded-full bg-fuchsia-500/15 blur-3xl"></div>
  </div>

  <main class="w-full max-w-2xl liquid-glass rounded-3xl p-6 sm:p-8 space-y-6">
    <!-- Header -->
    <div class="space-y-2">
      <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full glass-pill text-cyan-300 text-xs font-medium tracking-wide">
        <span class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_10px_#22d3ee]"></span>
        Dot-Only Mode • No "+" Tags • Max 10,000
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight bg-gradient-to-r from-white via-cyan-100 to-indigo-200 bg-clip-text text-transparent">
        Gmail Dot Alias Generator
      </h1>
      <p class="text-sm text-slate-300/80 leading-relaxed">
        Generates pure dot-variant Gmail addresses without any "+" symbols so forms accept them cleanly. All verification codes arrive directly in your main Gmail inbox.
      </p>
    </div>

    <!-- Inputs -->
    <div class="space-y-4">
      <div>
        <label for="baseEmail" class="block text-xs font-semibold uppercase tracking-wider text-slate-300/90 mb-2">
          Base Gmail Address
        </label>
        <input
          id="baseEmail"
          type="email"
          placeholder="example@gmail.com"
          class="w-full rounded-2xl glass-input px-4 py-3 text-sm text-white placeholder-slate-400"
        />
        <p id="capacityHint" class="mt-1.5 text-xs text-cyan-300/80"></p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="countInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-300/90 mb-2">
            Quantity (1 – 10,000)
          </label>
          <input
            id="countInput"
            type="number"
            min="1"
            max="10000"
            value="1000"
            class="w-full rounded-2xl glass-input px-4 py-3 text-sm text-white"
          />
        </div>

        <div class="flex flex-col justify-end">
          <span class="block text-xs font-semibold uppercase tracking-wider text-slate-300/90 mb-2">
            Quick Presets
          </span>
          <div class="grid grid-cols-4 gap-2">
            <button type="button" data-preset="100" class="preset-btn py-2.5 rounded-xl glass-pill text-xs font-semibold text-slate-100 cursor-pointer">100</button>
            <button type="button" data-preset="1000" class="preset-btn py-2.5 rounded-xl glass-pill text-xs font-semibold text-slate-100 cursor-pointer">1,000</button>
            <button type="button" data-preset="5000" class="preset-btn py-2.5 rounded-xl glass-pill text-xs font-semibold text-slate-100 cursor-pointer">5,000</button>
            <button type="button" data-preset="10000" class="preset-btn py-2.5 rounded-xl glass-pill text-xs font-semibold text-slate-100 cursor-pointer">10,000</button>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
        <label class="inline-flex items-center gap-2.5 px-3.5 py-2 rounded-xl glass-pill text-sm text-slate-200 cursor-pointer select-none">
          <input id="shuffleToggle" type="checkbox" checked class="accent-cyan-400 w-4 h-4 rounded cursor-pointer" />
          Random Shuffle
        </label>

        <button
          id="generateBtn"
          type="button"
          class="px-7 py-3 rounded-2xl liquid-btn text-slate-950 font-bold text-sm tracking-wide cursor-pointer"
        >
          Generate Dot Aliases
        </button>
      </div>
    </div>

    <!-- Status Banner -->
    <div id="statusMsg" class="hidden text-sm rounded-2xl px-4 py-3 backdrop-blur-md"></div>

    <!-- Result Box -->
    <div id="resultBox" class="hidden space-y-3 pt-4 border-t border-white/10">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <span id="totalBadge" class="text-sm font-semibold text-cyan-300"></span>
        <div class="flex items-center gap-2">
          <button
            id="copyBtn"
            type="button"
            class="px-4 py-2 rounded-xl glass-pill text-xs font-semibold text-white cursor-pointer"
          >
            Copy All
          </button>
          <button
            id="downloadBtn"
            type="button"
            class="px-4 py-2 rounded-xl bg-emerald-400/15 hover:bg-emerald-400/25 border border-emerald-300/30 text-emerald-200 text-xs font-semibold transition cursor-pointer"
          >
            Download .txt
          </button>
        </div>
      </div>

      <textarea
        id="outputArea"
        rows="10"
        readonly
        class="w-full rounded-2xl glass-input p-4 text-xs font-mono text-slate-100 leading-relaxed"
      ></textarea>
    </div>
  </main>

  <script>
    const baseEmailEl = document.getElementById('baseEmail');
    const capacityHint = document.getElementById('capacityHint');
    const countInputEl = document.getElementById('countInput');
    const shuffleEl = document.getElementById('shuffleToggle');
    const generateBtn = document.getElementById('generateBtn');
    const statusMsg = document.getElementById('statusMsg');
    const resultBox = document.getElementById('resultBox');
    const totalBadge = document.getElementById('totalBadge');
    const outputArea = document.getElementById('outputArea');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let generatedList = [];

    function getMaxDotVariants(email) {
      const clean = email.trim().toLowerCase();
      if (!/^[^\s@]+@gmail\.com$/i.test(clean)) return 0;
      const rawLocal = clean.split('@')[0];
      const baseLocal = rawLocal.split('+')[0].replace(/\./g, '');
      if (baseLocal.length < 2) return 0;
      const total = Math.pow(2, baseLocal.length - 1);
      // Exclude original base address if it has no dots
      return rawLocal.includes('.') ? total : total - 1;
    }

    baseEmailEl.addEventListener('input', () => {
      const max = getMaxDotVariants(baseEmailEl.value);
      if (max > 0) {
        capacityHint.textContent = `Max unique dot aliases available for this username: ${Math.min(max, 10000).toLocaleString()}`;
      } else {
        capacityHint.textContent = '';
      }
    });

    document.querySelectorAll('.preset-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        countInputEl.value = btn.dataset.preset;
      });
    });

    function showStatus(msg, isError = true) {
      statusMsg.textContent = msg;
      statusMsg.className = isError
        ? 'text-sm rounded-2xl px-4 py-3 backdrop-blur-md bg-rose-500/15 border border-rose-400/30 text-rose-200'
        : 'text-sm rounded-2xl px-4 py-3 backdrop-blur-md bg-emerald-500/15 border border-emerald-400/30 text-emerald-200';
      statusMsg.classList.remove('hidden');
    }

    function hideStatus() {
      statusMsg.classList.add('hidden');
    }

    function generateDotOnlyAliases(email, limit, shouldShuffle) {
      const clean = email.trim().toLowerCase();
      const [rawLocal, domain] = clean.split('@');
      // Strip any existing +tag and dots to build pure dot-only variants
      const baseLocal = rawLocal.split('+')[0].replace(/\./g, '');

      const set = new Set();
      const gaps = Math.max(0, baseLocal.length - 1);
      const totalMasks = Math.pow(2, Math.min(gaps, 22));

      for (let mask = 1; mask < totalMasks && set.size < limit; mask++) {
        let built = '';
        for (let i = 0; i < baseLocal.length; i++) {
          built += baseLocal[i];
          if (i < baseLocal.length - 1 && (mask & (1 << i)) !== 0) {
            built += '.';
          }
        }
        const candidate = `${built}@${domain}`;
        if (candidate !== clean) {
          set.add(candidate);
        }
      }

      const arr = Array.from(set);
      if (shouldShuffle) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      }
      return arr;
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      outputArea.focus();
      outputArea.select();
      document.execCommand('copy');
    }

    generateBtn.addEventListener('click', () => {
      hideStatus();
      const email = baseEmailEl.value.trim();
      const count = parseInt(countInputEl.value, 10);

      if (!/^[^\s@]+@gmail\.com$/i.test(email)) {
        showStatus('Please enter a valid @gmail.com address.');
        return;
      }

      if (isNaN(count) || count < 1 || count > 10000) {
        showStatus('Quantity must be between 1 and 10,000.');
        return;
      }

      generatedList = generateDotOnlyAliases(email, count, shuffleEl.checked);
      if (!generatedList.length) {
        showStatus('Username is too short to generate dot aliases.');
        return;
      }

      outputArea.value = generatedList.join('\n');
      totalBadge.textContent = `Generated: ${generatedList.length.toLocaleString()} pure dot aliases`;
      resultBox.classList.remove('hidden');

      if (generatedList.length < count) {
        showStatus(
          `Generated all ${generatedList.length.toLocaleString()} possible unique dot combinations for this username.`,
          false
        );
      } else {
        showStatus('Pure dot aliases generated successfully (no "+" tags).', false);
      }
    });

    copyBtn.addEventListener('click', async () => {
      if (!generatedList.length) return;
      await copyText(generatedList.join('\n'));
      copyBtn.textContent = 'Copied!';
      setTimeout(() => {
        copyBtn.textContent = 'Copy All';
      }, 1500);
    });

    downloadBtn.addEventListener('click', () => {
      if (!generatedList.length) return;
      const blob = new Blob([generatedList.join('\n')], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gmail_dot_aliases_${generatedList.length}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
